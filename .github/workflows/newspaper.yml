name: The Capital

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect news
        run: python news_engine/collect.py
      - name: Analyze with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PREVIOUS_EDITION_URL: https://krishbhutra19.github.io/The-Capital-/data/latest.json
        run: python news_engine/analyze.py
      - name: Save rolling market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update rolling market snapshot"
            git push
          fi
      - name: Assemble website
        run: |
          mkdir -p site/data
          cp website/index.html website/style.css website/app.js website/manifest.json site/
          cp data/latest.json site/data/latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/latest.json").read_text())
          Path("site/edition-data.js").write_text(
              "window.__THE_CAPITAL_DATA__ = " + json.dumps(data, ensure_ascii=False) + ";\n",
              encoding="utf-8"
          )
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
